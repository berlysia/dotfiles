packages:
  darwin:
    taps: []
    # Tools that mise can pin (see ~/.config/mise/config.toml) belong there, not here.
    # chezmoi is not listed: README installs it into ~/.local/bin on every OS.
    brews:
      # shell and everyday CLI
      - "age"
      - "bat"
      - "curl"
      - "fd"
      - "gh"
      - "ghq"
      - "git"
      - "git-secrets"
      - "gnupg"
      - "jq"
      - "mas"
      - "mise"
      - "mkcert"
      - "nkf"
      - "p7zip"
      - "patchutils"
      - "ripgrep"
      - "terminal-notifier"
      - "unzip"
      - "wget"
      - "zsh"
      # GNU variants (installed with the g prefix; only timeout is exposed unprefixed)
      - "coreutils"
      - "gawk"
      - "gnu-sed"
      - "grep"
      # development
      - "act"
      - "clingo"
      - "emacs"
      - "lychee"
      - "shellcheck"
      - "zizmor"
      # media
      - "aria2"
      - "ffmpeg"
      - "imagemagick"
      - "sox"
      - "whisper.cpp"
    casks:
      # apps
      - "1password"
      - "coteditor"
      - "dropbox"
      - "firefox"
      - "google-chrome"
      - "google-chrome@canary"
      - "raycast"
      - "slack"
      - "vlc"
      # development
      - "1password-cli"
      - "aws-vault-binary"
      - "iterm2"
      - "karabiner-elements"
      - "orbstack"
      - "visual-studio-code"
      # fonts
      - "font-moralerspace"
  linux:
    apt:
      - "age"
      - "wget"
      - "curl"
      - "emacs"
      - "git"
      - "gh"
      - "build-essential"
      - "bat"
      - "ripgrep"
      - "fd-find"
      - "jq"
      - "zsh"
      - "unzip"
      - "libnotify-bin"
      - "pulseaudio-utils"
      - "dunst"
      - "patchutils"
      - "shellcheck"
      - "sox"
  windows:
    winget:
      - "Git.Git"
      - "Microsoft.VisualStudioCode"
      - "Microsoft.PowerShell"
      - "Microsoft.WindowsTerminal"
      - "7zip.7zip"
      - "JesseDuffield.Lazygit"
      - "BurntSushi.ripgrep.GNU"
      - "sharkdp.bat"
      - "junegunn.fzf"
      - "jqlang.jq"
      - "GitHub.cli"
      - "Microsoft.PowerToys"
      - "jdx.mise"
