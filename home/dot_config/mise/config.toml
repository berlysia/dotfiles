# Shared by hosts and agent-vm. Host-only toolchains (go, rust and the tools
# built through them) live in conf.d/host-toolchains.toml, which the VM does
# not get (home/.chezmoiignore, ADR-0018 K5). Keep this file plain TOML:
# Renovate's mise manager parses it strictly and finds nothing in a template.
[settings]
idiomatic_version_file_enable_tools = ["node"]
experimental = true
minimum_release_age = "7d"

[settings.self_update]
# Auto updates fall back to minimum_release_age above, so mise itself also waits 7d.
# To take a fresh release sooner, run `mise self-update <VERSION>`, which skips the age gate.
auto = true

[settings.github]
# gh keeps its token in the OS keyring, so hosts.yml has no oauth_token and
# gh_cli_tokens finds nothing; ask gh directly. Private repos need the token,
# since mise-versions does not serve them and
# unauthenticated API calls get 404s until GitHub starts answering 403.
# gh auth token also returns GH_TOKEN, so agent-vm sessions with a per-repo PAT
# are covered; without any token mise falls back to unauthenticated requests.
credential_command = "gh auth token"

[tools]
bun = "1.4.4"
deno = "2.9.8"
direnv = "2.38.2"
# Through mise, not Homebrew: the merge wrapper of the delivery policy runs with PATH fixed to
# the mise shims and /usr/bin:/bin, so a Homebrew gh is invisible to it.
gh = "2.102.0"
fzf = "0.74.5" # Fuzzy finder - migrated from chezmoi external
gitleaks = "8.30.1"
node = "24.22.1"
# Decouple npm from the copy bundled with node so it is pinned and updated on its own
npm = "12.2.0"
pnpm = "12.12.1"
# Provides python3 on PATH ahead of /usr/bin (3.9). The security-guidance plugin needs 3.10+ and
# falls back to the bare python3 when no python3.10-3.13 exists, so this replaces Homebrew's python.
python = "3.15.0"
uv = "0.13.4"
yarn = "4.18.1"

# Security tools
"github:AikidoSec/safe-chain" = "1.5.25"

# Weekly downloads hover around aube's 1000/week threshold, so installs fail intermittently.
# The package and its author are known, so the low-download gate is explicitly approved.
"npm:@mizchi/readability" = { version = "0.7.7", allow_low_downloads = true }
# Follow Codex releases immediately, without the default seven-day delay.
"npm:@openai/codex" = { version = "latest", minimum_release_age = "0s" }
# Per-machine dev server proxy for agent-vm (docs/agent-vm.md, section 3 "VM でブラウザを使う"); it starts nothing until `portless run` is used.
portless = "0.15.7"
"github:k1LoW/mo" = "1.6.9"
# registry の `deck` は Kong/decK に解決されるため repo 指定が必須
"github:k1LoW/deck" = "1.24.2"
"npm:wrangler" = "latest"
"npm:@playwright/cli" = "latest"
"npm:difit" = "latest"
ast-grep = "latest"
# 0.35.0 was under a week old when pinned; an exact version is not filtered by minimum_release_age,
# so taking it early was deliberate.
apm = "0.35.0"
# The source repo is private, so take the public npm package instead of github:.
# It is our own package with a handful of weekly downloads, so the low-download gate is explicitly approved.
# 0.3.0 was under a week old when pinned (it reads Markdown comments); an exact version is not filtered
# by minimum_release_age, so taking it early was deliberate.
"npm:@berlysia/shiori" = { version = "0.3.0", allow_low_downloads = true }

# Tools AI agents reach for (article: ai-agent-first dotfiles)
yq = "4.54.1"
shfmt = "3.14.1"
hyperfine = "2.0.0"
duckdb = "1.5.6"
"github:boyter/scc" = "4.1.0"
# GitHub Actions linter (replaces actionlint and zizmor). Shared config because the
# claude-action-bootstrap skill relies on it in other repos; not in the mise registry, hence
# github:. Renovate must not automerge it (renovate.json): a new version can add default rules.
"github:jdx/jactionlint" = "2.2.0"
# Cyclomatic / cognitive complexity; not in the mise registry
"github:moznion/cccc" = "1.8.0"
# rm-compatible trash CLI; not in the mise registry
"github:babarot/gomi" = "1.6.5"
# Session archive with MCP search (claude-recall). Every release was under a week old when it was
# added, so minimum_release_age hid them all; pinning an exact version, which the gate does not
# filter, was a deliberate choice to take it anyway. Keep the table form: the plugin external in
# .chezmoiexternal.toml.tmpl reads .version from it and fails the apply if the two disagree. Renovate
# updates both in one PR (customManagers in renovate.json).
"github:babarot/claude-recall" = { version = "v1.12.0", bin = "recall" }
