# mise configuration for dotfiles project
# https://mise.jdx.dev/configuration.html

[settings]
minimum_release_age = "7d"

[tools]
"github:mizchi/actrun" = "0.32.0"
# scripts/lint-shell.sh, the pre-commit hook and CI run this version; lint-shell.sh reads this
# exact line ("github:koalaman/shellcheck" = "<version>") and ci-shellcheck.yml installs it by
# this id. Editors use the brew / apt shellcheck from home/.chezmoidata/packages.yaml (not pinned).
"github:koalaman/shellcheck" = "0.11.0"
