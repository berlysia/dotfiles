name: TypeScript CI

on:
  push:
    branches: [master, main]
    paths:
      - "**/*.ts"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - ".github/workflows/ci-typescript.yml"
      - ".github/actions/setup-node-bun/**"
  pull_request:
    branches: [master, main]
    paths:
      - "**/*.ts"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - ".github/workflows/ci-typescript.yml"
      - ".github/actions/setup-node-bun/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node.js with bun
        uses: ./.github/actions/setup-node-bun

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      # format:check はリポジトリ全体が対象で paths フィルタと両立しないため
      # ci-format.yml に分離した。ここは TS スコープの lint のみを担う。
      - name: Lint check
        run: bun run lint:oxlint
