name: TypeScript CI

on:
  push:
    branches: [master, main]
    paths:
      - "**/*.ts"
      - "**/*.mts"
      - "tests/tailnet-ssh.test.mjs"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - ".github/workflows/ci-typescript.yml"
      - ".github/actions/setup-node-bun/**"
      # hook-target-drift.test.ts が読む。status-check.yml は paths フィルタで
      # 未実行の workflow を success 扱いにするため、ここに無いと tmpl のみを
      # 変更した PR で当該テストが一度も走らないまま green になる。
      - "home/dot_claude/.settings.hooks.json.tmpl"
      # unit / perf のテストがラッパーを実行し、preload が全テストの予算と
      # 環境を決める。ここに無いと、これらだけを変更した PR でテストが走らない。
      - "home/dot_claude/hooks/executable_*.sh"
      - "home/dot_claude/hooks/tests/**/*.mjs"
      # chezmoiremove-coverage.test.mjs が home/ の追加・削除・名前の変更を
      # 履歴から見る。paths フィルタは削除だけを選べないので home/ 全体を入れる。
      - "home/**"
      - "tests/chezmoiremove-coverage.test.mjs"
      - "tests/heavy/**"
      - "tests/lib/**"
      # ja-baseline.test.mjs が結果のスキーマを検査する。ここに無いと、結果だけを直す PR で
      # テストが走らないまま通り、plan-4・5 が結果を根拠にする前提が崩れる。
      - "tests/ja-baseline/**"
      - "tests/ja-baseline.test.mjs"
      # install-chezmoi.test.mjs runs the action's install script and checks its Renovate wiring.
      - "renovate.json"
      - ".github/actions/install-chezmoi/**"
      - "tests/install-chezmoi.test.mjs"
  pull_request:
    branches: [master, main]
    paths:
      - "**/*.ts"
      - "**/*.mts"
      - "tests/tailnet-ssh.test.mjs"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - ".github/workflows/ci-typescript.yml"
      - ".github/actions/setup-node-bun/**"
      # hook-target-drift.test.ts が読む。status-check.yml は paths フィルタで
      # 未実行の workflow を success 扱いにするため、ここに無いと tmpl のみを
      # 変更した PR で当該テストが一度も走らないまま green になる。
      - "home/dot_claude/.settings.hooks.json.tmpl"
      # unit / perf のテストがラッパーを実行し、preload が全テストの予算と
      # 環境を決める。ここに無いと、これらだけを変更した PR でテストが走らない。
      - "home/dot_claude/hooks/executable_*.sh"
      - "home/dot_claude/hooks/tests/**/*.mjs"
      # chezmoiremove-coverage.test.mjs が home/ の追加・削除・名前の変更を
      # 履歴から見る。paths フィルタは削除だけを選べないので home/ 全体を入れる。
      - "home/**"
      - "tests/chezmoiremove-coverage.test.mjs"
      - "tests/heavy/**"
      - "tests/lib/**"
      # ja-baseline.test.mjs が結果のスキーマを検査する。ここに無いと、結果だけを直す PR で
      # テストが走らないまま通り、plan-4・5 が結果を根拠にする前提が崩れる。
      - "tests/ja-baseline/**"
      - "tests/ja-baseline.test.mjs"
      # install-chezmoi.test.mjs runs the action's install script and checks its Renovate wiring.
      - "renovate.json"
      - ".github/actions/install-chezmoi/**"
      - "tests/install-chezmoi.test.mjs"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # chezmoiremove-coverage.test.mjs walks the whole history for deleted
          # source files, and fails under CI=true on a shallow clone.
          fetch-depth: 0

      - name: Setup Node.js with bun
        uses: ./.github/actions/setup-node-bun

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      # Wall-clock assertions (ReDoS guards, wrapper timing) live here so that
      # the completion gate and pre-commit, which run `test`, never race them.
      - name: Run perf tests
        run: bun run test:perf

      # Tests that start git or are slow under load. They run serially here and
      # not in `test`, so the completion gate and pre-commit never wait on them.
      - name: Run heavy tests
        run: bun run test:heavy

      # format:check はリポジトリ全体が対象で paths フィルタと両立しないため
      # ci-format.yml に分離した。ここは TS スコープの lint のみを担う。
      - name: Lint check
        run: bun run lint:oxlint
