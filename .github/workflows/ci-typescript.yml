name: TypeScript CI

on:
  push:
    branches: [master, main]
    paths:
      - "**/*.ts"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - ".github/workflows/ci-typescript.yml"
      - ".github/actions/setup-node-bun/**"
      # hook-target-drift.test.ts が読む。status-check.yml は paths フィルタで
      # 未実行の workflow を success 扱いにするため、ここに無いと tmpl のみを
      # 変更した PR で当該テストが一度も走らないまま green になる。
      - "home/dot_claude/.settings.hooks.json.tmpl"
  pull_request:
    branches: [master, main]
    paths:
      - "**/*.ts"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - ".github/workflows/ci-typescript.yml"
      - ".github/actions/setup-node-bun/**"
      # hook-target-drift.test.ts が読む。status-check.yml は paths フィルタで
      # 未実行の workflow を success 扱いにするため、ここに無いと tmpl のみを
      # 変更した PR で当該テストが一度も走らないまま green になる。
      - "home/dot_claude/.settings.hooks.json.tmpl"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js with bun
        uses: ./.github/actions/setup-node-bun

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      # format:check はリポジトリ全体が対象で paths フィルタと両立しないため
      # ci-format.yml に分離した。ここは TS スコープの lint のみを担う。
      - name: Lint check
        run: bun run lint:oxlint
