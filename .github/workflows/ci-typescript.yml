name: TypeScript CI

on:
  push:
    branches: [master, main]
    paths:
      - "**/*.ts"
      - "**/*.mts"
      - "tests/tailnet-ssh.test.mjs"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - ".github/workflows/ci-typescript.yml"
      - ".github/actions/setup-node-bun/**"
      # hook-target-drift.test.ts が読む。status-check.yml は paths フィルタで
      # 未実行の workflow を success 扱いにするため、ここに無いと tmpl のみを
      # 変更した PR で当該テストが一度も走らないまま green になる。
      - "home/dot_claude/.settings.hooks.json.tmpl"
      # unit / perf のテストがラッパーを実行し、preload が全テストの予算と
      # 環境を決める。ここに無いと、これらだけを変更した PR でテストが走らない。
      - "home/dot_claude/hooks/executable_*.sh"
      - "home/dot_claude/hooks/tests/**/*.mjs"
      # chezmoiremove-coverage.test.mjs が home/ の追加・削除・名前の変更を
      # 履歴から見る。paths フィルタは削除だけを選べないので home/ 全体を入れる。
      - "home/**"
      - "tests/chezmoiremove-coverage.test.mjs"
      - "tests/heavy/**"
      - "tests/lib/**"
      # ja-baseline.test.mjs が結果のスキーマを検査する。ここに無いと、結果だけを直す PR で
      # テストが走らないまま通り、規則を移すときに旧の結果と突き合わせる前提が崩れる。
      - "tests/ja-baseline/**"
      - "tests/ja-baseline.test.mjs"
      # install-chezmoi.test.mjs runs the action's install script and checks its Renovate wiring.
      - "renovate.json"
      - ".github/actions/install-chezmoi/**"
      - "tests/install-chezmoi.test.mjs"
      # japanese-check の実行環境と辞書。これらだけを変えた PR でも解析器のテストが走るように。
      - "home/dot_config/japanese-check/**"
      - "home/.chezmoidata/japanese_check.yaml"
      - "scripts/fetch-japanese-check-dictionary.sh"
  pull_request:
    branches: [master, main]
    paths:
      - "**/*.ts"
      - "**/*.mts"
      - "tests/tailnet-ssh.test.mjs"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - ".github/workflows/ci-typescript.yml"
      - ".github/actions/setup-node-bun/**"
      # hook-target-drift.test.ts が読む。status-check.yml は paths フィルタで
      # 未実行の workflow を success 扱いにするため、ここに無いと tmpl のみを
      # 変更した PR で当該テストが一度も走らないまま green になる。
      - "home/dot_claude/.settings.hooks.json.tmpl"
      # unit / perf のテストがラッパーを実行し、preload が全テストの予算と
      # 環境を決める。ここに無いと、これらだけを変更した PR でテストが走らない。
      - "home/dot_claude/hooks/executable_*.sh"
      - "home/dot_claude/hooks/tests/**/*.mjs"
      # chezmoiremove-coverage.test.mjs が home/ の追加・削除・名前の変更を
      # 履歴から見る。paths フィルタは削除だけを選べないので home/ 全体を入れる。
      - "home/**"
      - "tests/chezmoiremove-coverage.test.mjs"
      - "tests/heavy/**"
      - "tests/lib/**"
      # ja-baseline.test.mjs が結果のスキーマを検査する。ここに無いと、結果だけを直す PR で
      # テストが走らないまま通り、規則を移すときに旧の結果と突き合わせる前提が崩れる。
      - "tests/ja-baseline/**"
      - "tests/ja-baseline.test.mjs"
      # install-chezmoi.test.mjs runs the action's install script and checks its Renovate wiring.
      - "renovate.json"
      - ".github/actions/install-chezmoi/**"
      - "tests/install-chezmoi.test.mjs"
      # japanese-check の実行環境と辞書。これらだけを変えた PR でも解析器のテストが走るように。
      - "home/dot_config/japanese-check/**"
      - "home/.chezmoidata/japanese_check.yaml"
      - "scripts/fetch-japanese-check-dictionary.sh"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # chezmoiremove-coverage.test.mjs walks the whole history for deleted
          # source files, and fails under CI=true on a shallow clone.
          fetch-depth: 0

      - name: Setup Node.js with bun
        uses: ./.github/actions/setup-node-bun

      # japanese-check's analyzer (lindera) and its UniDic dictionary live outside the checkout, as
      # they do under ~/.config/japanese-check for a user. The runtime dir is owner-only because the
      # checker refuses a group- or world-writable one. The zip is cached by its pinned sha256 and
      # checked again on every run, cache hit or not.
      - name: Install chezmoi
        uses: ./.github/actions/install-chezmoi
        with:
          install-dir: "${{ runner.temp }}/bin"
          add-to-path: "true"

      - name: Read dictionary pin
        id: dictionary
        run: echo "sha256=$(chezmoi execute-template --source "$PWD/home" '{{ .japanese_check.dictionary.sha256 }}')" >> "$GITHUB_OUTPUT"

      - name: Restore dictionary zip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dictionary-cache
          key: japanese-check-dictionary-${{ steps.dictionary.outputs.sha256 }}

      - name: Prepare japanese-check runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime="${RUNNER_TEMP}/japanese-check"
          mkdir -m 700 "${runtime}"
          cp home/dot_config/japanese-check/package.json home/dot_config/japanese-check/bun.lock bunfig.toml "${runtime}/"
          (cd "${runtime}" && bun install --frozen-lockfile --ignore-scripts)
          scripts/fetch-japanese-check-dictionary.sh "${runtime}/unidic" "${RUNNER_TEMP}/dictionary-cache/lindera-unidic.zip"
          echo "JAPANESE_CHECK_RUNTIME_DIR=${runtime}" >> "$GITHUB_ENV"

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      # Wall-clock assertions (ReDoS guards, wrapper timing) live here so that
      # the completion gate and pre-commit, which run `test`, never race them.
      - name: Run perf tests
        run: bun run test:perf

      # Tests that start git or are slow under load. They run serially here and
      # not in `test`, so the completion gate and pre-commit never wait on them.
      - name: Run heavy tests
        run: bun run test:heavy

      # format:check はリポジトリ全体が対象で paths フィルタと両立しないため
      # ci-format.yml に分離した。ここは TS スコープの lint のみを担う。
      - name: Lint check
        run: bun run lint:oxlint

  # The adapter loads a native package and reads a dictionary through realpath checks, so run the
  # tests that exercise those on macOS too. The other hooks tests do not depend on the platform.
  japanese-check-macos:
    name: japanese-check (macOS)
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js with bun
        uses: ./.github/actions/setup-node-bun

      - name: Install chezmoi
        uses: ./.github/actions/install-chezmoi
        with:
          install-dir: "${{ runner.temp }}/bin"
          add-to-path: "true"

      - name: Read dictionary pin
        id: dictionary
        run: echo "sha256=$(chezmoi execute-template --source "$PWD/home" '{{ .japanese_check.dictionary.sha256 }}')" >> "$GITHUB_OUTPUT"

      - name: Restore dictionary zip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dictionary-cache
          key: japanese-check-dictionary-${{ steps.dictionary.outputs.sha256 }}

      - name: Prepare japanese-check runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime="${RUNNER_TEMP}/japanese-check"
          mkdir -m 700 "${runtime}"
          cp home/dot_config/japanese-check/package.json home/dot_config/japanese-check/bun.lock bunfig.toml "${runtime}/"
          (cd "${runtime}" && bun install --frozen-lockfile --ignore-scripts)
          scripts/fetch-japanese-check-dictionary.sh "${runtime}/unidic" "${RUNNER_TEMP}/dictionary-cache/lindera-unidic.zip"
          echo "JAPANESE_CHECK_RUNTIME_DIR=${runtime}" >> "$GITHUB_ENV"

      # The deps test is here because the realpath of a temp dir differs on macOS (/var is /private/var),
      # which changes what the symlink and allowed-root checks see.
      - name: Run japanese-check adapter tests
        run: >-
          CLAUDE_TEST_FORBID_GIT=1 node --import ./home/dot_claude/hooks/tests/preload-test-env.mjs --test
          home/dot_claude/hooks/tests/unit/japanese-check-lindera.test.ts
          home/dot_claude/hooks/tests/unit/japanese-check-contract.test.ts
          home/dot_claude/hooks/tests/unit/japanese-check-deps.test.ts
