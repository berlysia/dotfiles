name: Shell Compatibility Test

on:
  push:
    branches: [master, main]
    paths:
      - "home/dot_shell_common/**"
      - "home/dot_bashrc"
      - "home/dot_bash_profile"
      - "home/dot_zsh/**"
      - "home/dot_zshenv"
      - "home/dot_zshrc"
      - ".github/workflows/test-shell-compatibility.yml"
      - ".github/actions/install-chezmoi/**"
      - "tests/shell-gate/**"
      - "home/dot_codex/.config.toml"
      - "home/.chezmoiignore"
      - "home/.chezmoiscripts/run_onchange_install-packages-1-darwin.sh.tmpl"
  pull_request:
    branches: [master, main]
    paths:
      - "home/dot_shell_common/**"
      - "home/dot_bashrc"
      - "home/dot_bash_profile"
      - "home/dot_zsh/**"
      - "home/dot_zshenv"
      - "home/dot_zshrc"
      - ".github/workflows/test-shell-compatibility.yml"
      - ".github/actions/install-chezmoi/**"
      - "tests/shell-gate/**"
      - "home/dot_codex/.config.toml"
      - "home/.chezmoiignore"
      - "home/.chezmoiscripts/run_onchange_install-packages-1-darwin.sh.tmpl"
  workflow_dispatch: # Allow manual trigger

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shells on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh bash

      # compinit asks y/n on the tty when fpath has group/other-writable dirs; under
      # the TTY probes nothing answers and the human zsh hangs until the watchdog.
      - name: Secure zsh completion dirs on Ubuntu
        if: runner.os == 'Linux'
        run: |
          insecure=$(zsh -fc 'autoload -Uz compaudit; compaudit' 2>/dev/null || true)
          printf 'compaudit: %s\n' "${insecure:-<none>}"
          if [ -n "$insecure" ]; then printf '%s\n' "$insecure" | xargs sudo chmod g-w,o-w; fi

      - name: Install shells on macOS
        if: runner.os == 'macOS'
        run: |
          # bash and zsh are already installed on macOS
          echo "bash version: $(bash --version | head -1)"
          echo "zsh version: $(zsh --version)"

      - name: Install chezmoi
        uses: ./.github/actions/install-chezmoi
        with:
          install-dir: "$HOME/.local/bin"
          add-to-path: "true"

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Run shell compatibility tests
        run: |
          chmod +x home/dot_shell_common/test_suite.sh
          ./home/dot_shell_common/test_suite.sh --pre-apply -v
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Run shell gate tests
        run: bash tests/shell-gate/run.sh

      - name: Check macOS timeout exposure
        if: runner.os == 'macOS'
        run: |
          command -v gtimeout || brew install coreutils
          T=$(mktemp -d)
          # --source home so the template sees .chezmoidata (packages.darwin.*)
          chezmoi --source home execute-template --no-tty < home/.chezmoiscripts/run_onchange_install-packages-1-darwin.sh.tmpl \
            | sed -n '/^# Expose only timeout from coreutils/,/^fi$/p' \
            | HOME="$T" sh
          test -L "$T/.local/bin/timeout"
          "$T/.local/bin/timeout" 1 true
