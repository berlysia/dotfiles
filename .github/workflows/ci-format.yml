name: Format Check

# format:check はリポジトリ全体を対象とするため paths フィルタを持たない。
# 対象拡張子を paths に列挙すると、列挙漏れの拡張子だけを含む変更が
# 無検査で通る (実例: .skills/**/*.md のみの commit が TypeScript CI を
# 発火させず、整形違反がそのまま master に入った)。
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js with bun
        uses: ./.github/actions/setup-node-bun

      - name: Check formatting
        run: bun run format:check
