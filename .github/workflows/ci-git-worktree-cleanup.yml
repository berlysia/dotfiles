name: git-worktree-cleanup Tests

on:
  push:
    branches: [master, main]
    paths:
      - "home/dot_local/bin/executable_git-worktree-cleanup"
      - "home/dot_local/bin/executable_git-worktree-create"
      - "tests/git-worktree-cleanup/**"
      - "tests/git-worktree-create/**"
      - ".github/workflows/ci-git-worktree-cleanup.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "home/dot_local/bin/executable_git-worktree-cleanup"
      - "home/dot_local/bin/executable_git-worktree-create"
      - "tests/git-worktree-cleanup/**"
      - "tests/git-worktree-create/**"
      - ".github/workflows/ci-git-worktree-cleanup.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: git-worktree-cleanup tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # /bin/bash is 3.2 on macOS: the script must run on the stock shell.
      - name: Run git-worktree-cleanup tests
        run: /bin/bash tests/git-worktree-cleanup/run.sh
      - name: Run git-worktree-create tests
        run: /bin/bash tests/git-worktree-create/run.sh
