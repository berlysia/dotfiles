name: Shell Lint (shellcheck)

# lint-shell.sh は対象を shebang で発見するため、対象集合を paths パターンで
# 表現できない。拡張子を列挙すると拡張子なしのシェルスクリプト (git hooks,
# chezmoi の executable_* / modify_*) を変更しても CI が発火せず、実際に
# scripts/hooks/pre-commit は一度も CI で検査されていなかった。
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install mise and the pinned shellcheck (a failure here is setup, not lint)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.2
          install: true
          install_args: github:koalaman/shellcheck
          cache: false
          github_token: ${{ github.token }}

      - name: Install chezmoi
        uses: ./.github/actions/install-chezmoi
        with:
          install-dir: "$HOME/.local/bin"
          add-to-path: "true"

      - name: Test lint-shell.sh
        run: bash tests/lint-shell/run.sh

      - name: Run shellcheck
        run: ./scripts/lint-shell.sh
