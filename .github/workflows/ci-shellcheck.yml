name: Shell Lint (shellcheck)

# lint-shell.sh は対象を shebang で発見するため、対象集合を paths パターンで
# 表現できない。拡張子を列挙すると拡張子なしのシェルスクリプト (git hooks,
# chezmoi の executable_* / modify_*) を変更しても CI が発火せず、実際に
# scripts/hooks/pre-commit は一度も CI で検査されていなかった。
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install chezmoi
        uses: ./.github/actions/install-chezmoi
        with:
          install-dir: "$HOME/.local/bin"
          add-to-path: "true"

      - name: Run shellcheck
        run: ./scripts/lint-shell.sh
