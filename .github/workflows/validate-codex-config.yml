name: Validate Codex Config

on:
  push:
    branches:
      - master
      - main
    paths:
      - "home/dot_codex/.config.toml"
      - "home/dot_codex/.config.*.toml"
      - "scripts/check-codex-config.sh"
      - "scripts/format-codex-config.sh"
      - ".github/workflows/validate-codex-config.yml"
  pull_request:
    paths:
      - "home/dot_codex/.config.toml"
      - "home/dot_codex/.config.*.toml"
      - "scripts/check-codex-config.sh"
      - "scripts/format-codex-config.sh"
      - ".github/workflows/validate-codex-config.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js with bun
        uses: ./.github/actions/setup-node-bun

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          reshim: true

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh

      - name: Validate Codex config formatting
        run: ./scripts/check-codex-config.sh
