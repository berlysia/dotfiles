name: agent-vm Launcher Tests

on:
  push:
    branches: [master, main]
    paths:
      - "home/dot_local/bin/executable_agent-vm"
      - "home/dot_local/bin/executable_agent-vm-node-modules"
      - "home/dot_codex/**"
      - "home/.chezmoiremove"
      - "tests/agent-vm/**"
      - ".github/workflows/ci-agent-vm.yml"
      - "agent-vm/**"
      - "home/.chezmoi.toml.tmpl"
      - "home/dot_config/mise/**"
      - "home/.chezmoiscripts/**"
      - "home/.chezmoiignore"
      - "home/.chezmoidata/**"
      - "home/dot_shell_common/agent_vm.sh"
      - "home/dot_shell_common/darwin.sh"
      - "home/dot_zshenv"
      - "home/dot_zshrc"
      - "home/dot_zsh/**"
  pull_request:
    branches: [master, main]
    paths:
      - "home/dot_local/bin/executable_agent-vm"
      - "home/dot_local/bin/executable_agent-vm-node-modules"
      - "home/dot_codex/**"
      - "home/.chezmoiremove"
      - "tests/agent-vm/**"
      - ".github/workflows/ci-agent-vm.yml"
      - "agent-vm/**"
      - "home/.chezmoi.toml.tmpl"
      - "home/dot_config/mise/**"
      - "home/.chezmoiscripts/**"
      - "home/.chezmoiignore"
      - "home/.chezmoidata/**"
      - "home/dot_shell_common/agent_vm.sh"
      - "home/dot_shell_common/darwin.sh"
      - "home/dot_zshenv"
      - "home/dot_zshrc"
      - "home/dot_zsh/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: agent-vm tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # /bin/bash is 3.2 on macOS: the launcher must run on the stock shell.
      - name: Run launcher tests
        run: /bin/bash tests/agent-vm/run.sh
      # Same reasoning as the launcher tests: exercise the stock macOS bash 3.2, not a newer one earlier on PATH.
      - name: Run shell function tests
        run: /bin/bash tests/agent-vm/run-shell.sh
      - name: Install chezmoi
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-chezmoi
        with:
          install-dir: "$HOME/.local/bin"
          add-to-path: "true"
      - name: Run VM bootstrap tests
        if: runner.os == 'Linux'
        run: bash tests/agent-vm/run-bootstrap.sh
      - name: Run template tests
        if: runner.os == 'Linux'
        run: bash tests/agent-vm/run-templates.sh
      - name: Run node_modules helper tests
        if: runner.os == 'Linux'
        run: bash tests/agent-vm/run-node-modules.sh
