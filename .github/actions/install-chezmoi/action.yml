name: Install chezmoi
description: Install chezmoi binary

inputs:
  install-dir:
    description: "Installation directory"
    required: false
    default: "/usr/local/bin"
  add-to-path:
    description: "Add installation directory to PATH"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Inputs are not shell-expanded, so a caller's "$HOME/.local/bin" arrives as that literal text. Expand a
    # leading $HOME or ~ here; otherwise chezmoi lands in a directory literally named "$HOME" under the checkout
    # and PATH gets a relative entry, which breaks anything that resolves chezmoi's path (e.g. a symlink to it).
    - name: Install chezmoi
      shell: bash
      env:
        INSTALL_DIR: ${{ inputs.install-dir }}
      run: |
        dir="${INSTALL_DIR/#\~/$HOME}"
        dir="${dir/#\$HOME/$HOME}"
        sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "${dir}"

    - name: Add to PATH
      if: inputs.add-to-path == 'true'
      shell: bash
      env:
        INSTALL_DIR: ${{ inputs.install-dir }}
      # github-env: install-dir only ever comes from this repository's own workflow files (a constant such as
      # "$HOME/.local/bin"), never from event data such as a PR title or branch name, so no attacker-controlled
      # text reaches GITHUB_PATH. A fork PR that edits the workflow could change it, but could equally run any
      # command directly, so writing it to GITHUB_PATH adds no capability.
      run: | # zizmor: ignore[github-env]
        dir="${INSTALL_DIR/#\~/$HOME}"
        dir="${dir/#\$HOME/$HOME}"
        echo "${dir}" >> "$GITHUB_PATH"
