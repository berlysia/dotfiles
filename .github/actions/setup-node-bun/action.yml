name: Setup Node.js with bun
description: Setup Node.js environment with bun and install dependencies

inputs:
  node-version:
    description: "Node.js version"
    required: false
    default: "22"
  install-deps:
    description: "Install dependencies with frozen lockfile"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        # Keep in sync with home/dot_config/mise/config.toml
        bun-version: "1.4.2"

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      shell: bash
      env:
        INSTALL_DEPS: ${{ inputs.install-deps }}
      # The condition lives in the shell, not in `if:`, so runners that cannot evaluate composite-step
      # expressions (actrun) behave the same as GitHub Actions.
      run: |
        if [ "${INSTALL_DEPS}" = "true" ]; then
          bun install --frozen-lockfile
        fi
